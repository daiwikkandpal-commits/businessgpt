[build]
  functions = "netlify/functions"
 
[functions]
  node_bundler = "esbuild"
 
[functions."mark"]
  timeout = 26
 
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
